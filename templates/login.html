<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Login Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #0f172a;
            color: white;
        }

        .login-container {
            width: 380px;

            background: #1e293b;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;

            color: #38bdf8;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #94a3b8;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #475569;

            border-radius: 6px;

            background: #0f172a;

            color: white;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #38bdf8;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #0284c7;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .info {
            margin-top: 25px;

            padding: 12px;

            background: #0f172a;

            border-radius: 6px;

            color: #94a3b8;

            font-size: 13px;

            text-align: center;
        }
    </style>

</head>


<body>

    <div class="login-container">

        <h1>Secure Login Lab</h1>

        <div class="subtitle">
            Authentication Security Testing
        </div>


        <form action="/login" method="POST">

            <label for="username">
                Username
            </label>

            <input type="text" id="username" name="username" placeholder="Enter username" required>


            <label for="password">
                Password
            </label>

            <input type="password" id="password" name="password" placeholder="Enter password" required>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="info">

            Authorized Security Testing Lab

            <br><br>

            Brute-force detection & authentication monitoring

        </div>

    </div>

</body>

</html>
